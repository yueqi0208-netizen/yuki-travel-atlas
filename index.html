  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23122b42'/%3E%3Cpath d='M12 45 31 14l21 31H12Z' fill='none' stroke='%23f2bd79' stroke-width='5' stroke-linejoin='round'/%3E%3Ccircle cx='31' cy='33' r='5' fill='%23f2bd79'/%3E%3C/svg%3E">
  <style>
    :root{font-family:Inter,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:#172d40;background:#f6f4ef;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button{font:inherit}button:focus-visible{outline:3px solid #e69144;outline-offset:3px}.shell{max-width:1500px;margin:auto;min-height:100vh;padding:26px clamp(18px,4vw,64px) 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-bottom:22px;border-bottom:1px solid #d7d7d0}.brand{display:flex;align-items:center;gap:13px;font-size:1.03rem;font-weight:750;letter-spacing:.02em}.brandmark{width:36px;height:36px;border-radius:11px;background:#122b42;color:#f4bc77;display:grid;place-items:center;font-size:19px}.top small{color:#6a7880;font-size:.84rem}.intro{display:flex;justify-content:space-between;align-items:end;gap:25px;margin:30px 0 25px}.eyebrow{font-size:.85rem;color:#a55f2b;font-weight:750;letter-spacing:.13em}.intro h1{font-family:Georgia,"Songti SC",serif;font-weight:600;font-size:clamp(2.1rem,4.4vw,4.1rem);line-height:1.13;letter-spacing:-.04em;margin:10px 0 6px}.intro p{color:#667580;margin:0;font-size:1rem;line-height:1.55}.count{min-width:150px;text-align:right;padding-bottom:5px}.count b{font-family:Georgia,serif;font-size:2.3rem;font-weight:500}.count span{display:block;font-size:.8rem;color:#697780}.workspace{display:grid;grid-template-columns:minmax(0,1.48fr) minmax(320px,.78fr);gap:20px;align-items:stretch}.map-panel{background:#dbe7e7;border:1px solid #cad9d9;border-radius:23px;min-height:580px;overflow:hidden;position:relative;display:flex;flex-direction:column}.map-head{position:relative;z-index:2;padding:26px 28px 0;display:flex;justify-content:space-between;align-items:start;gap:12px}.map-head strong{font-size:1.1rem}.map-head span{font-size:.8rem;color:#52717a}.map-head div{display:grid;gap:5px}.map-key{display:flex;align-items:center;gap:8px;padding:9px 11px;background:#f8faf7cc;border:1px solid #ffffffad;border-radius:999px;font-size:.78rem;color:#4c6971}.map-key i{width:8px;height:8px;border-radius:50%;background:#bf6744}.map-wrap{flex:1;min-height:470px;position:relative;padding:0 4px 6px}.map-wrap svg{width:100%;height:100%;display:block;overflow:visible}.gridline{stroke:#b2cbcb;stroke-width:1;stroke-dasharray:3 8}.coast-hint{fill:#f0eee7;stroke:#b9c9c4;stroke-width:1.7}.island{fill:#f0eee7;stroke:#b9c9c4;stroke-width:1.4}.route{fill:none;stroke:#bd714c;stroke-width:2.1;stroke-dasharray:5 8;stroke-linecap:round;opacity:.75}.map-label{font-family:Georgia,serif;fill:#799198;font-size:13px;letter-spacing:.08em}.city-button{position:absolute;transform:translate(-50%,-50%);z-index:3;border:0;background:transparent;color:#19354a;cursor:pointer;padding:0;width:22px;height:22px;display:grid;place-items:center;white-space:nowrap}.city-button .dot{width:18px;height:18px;background:#fff;border:5px solid #b76b49;box-shadow:0 0 0 4px #ffffffa8,0 2px 9px #173b4c33;border-radius:50%;transition:transform .2s,background .2s}.city-button.active .dot,.city-button:hover .dot{transform:scale(1.23);background:#142f47;border-color:#fff;box-shadow:0 0 0 5px #bd714c,0 4px 13px #173b4c55}.city-button .label{position:absolute;top:22px;left:50%;transform:translate(calc(-50% + var(--lx)),var(--ly));font-size:.82rem;font-weight:750;background:#fffef9ec;padding:6px 9px;border-radius:7px;box-shadow:0 2px 7px #33535c1b}.city-button.active .label{background:#122b42;color:white}.map-foot{position:absolute;bottom:18px;left:27px;color:#69858c;font-size:.76rem;z-index:2}.detail{background:#fffefa;border:1px solid #e4e0d8;border-radius:23px;overflow:hidden;display:flex;flex-direction:column;min-height:580px}.detail-image{height:205px;position:relative;background:linear-gradient(140deg,#456a7c,#a6bbb8);overflow:hidden}.detail-image img{width:100%;height:100%;display:block;object-fit:cover}.image-credit{position:absolute;right:12px;bottom:10px;background:#122b42b8;color:white;padding:4px 7px;border-radius:4px;font-size:.7rem}.detail-body{padding:25px 28px 24px;display:flex;flex-direction:column;flex:1}.detail-index{font-size:.78rem;color:#a15d36;letter-spacing:.12em;font-weight:750}.detail h2{font-family:Georgia,"Songti SC",serif;font-weight:500;font-size:2.35rem;margin:12px 0 4px;line-height:1.12}.detail .english{font-size:.9rem;color:#829098;margin:0 0 22px}.detail h3{font-size:.78rem;letter-spacing:.12em;color:#73828b;margin:0 0 12px}.places{list-style:none;margin:0;padding:0;display:grid;gap:11px}.places li{padding:12px 14px;background:#f5f5f0;border-radius:10px;font-size:.93rem;line-height:1.35}.detail-note{margin:auto 0 0;padding-top:22px;color:#64727a;font-size:.83rem;line-height:1.5}.stops{padding-top:29px}.section-line{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}.section-line h2{font-size:1rem;margin:0}.section-line span{font-size:.8rem;color:#77838a}.stop-list{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:9px}.stop{background:#fffefa;border:1px solid #e2ded5;border-radius:12px;text-align:left;padding:15px 12px 13px;min-height:88px;cursor:pointer;transition:background .2s,border-color .2s,transform .2s}.stop:hover{transform:translateY(-2px);border-color:#bf8d6d}.stop.active{background:#122b42;color:white;border-color:#122b42}.stop .num{display:block;font-size:.75rem;color:#a56d4d;margin-bottom:12px}.stop.active .num{color:#edbc84}.stop .name{font-size:.91rem;font-weight:700}.stop .en{display:block;font-size:.75rem;margin-top:3px;color:#7b898f}.stop.active .en{color:#b8c9ce}.footer{margin-top:28px;color:#849099;font-size:.75rem;line-height:1.5}@media(max-width:930px){.workspace{grid-template-columns:1fr}.map-panel{min-height:480px}.map-wrap{min-height:380px}.detail{min-height:0;display:grid;grid-template-columns:42% 1fr}.detail-image{height:100%;min-height:300px}.stop-list{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.shell{padding:18px 14px 30px}.top{padding:0 5px 17px}.top small{font-size:.72rem}.intro{margin:25px 5px 21px}.intro h1{font-size:2.22rem}.intro p{font-size:.9rem}.count{min-width:65px}.count b{font-size:1.9rem}.count span{font-size:.7rem}.workspace{gap:14px}.map-panel{min-height:440px;border-radius:17px}.map-head{padding:20px 17px 0}.map-wrap{min-height:350px}.map-key{font-size:.7rem}.city-button .dot{width:15px;height:15px;border-width:4px}.city-button .label{font-size:.7rem;padding:5px 6px}.map-foot{left:17px;bottom:12px;font-size:.66rem}.detail{display:block;border-radius:17px}.detail-image{height:154px;min-height:0}.detail-body{min-height:295px;padding:21px}.detail h2{font-size:2rem}.places{grid-template-columns:1fr 1fr;gap:8px}.places li{font-size:.84rem;padding:10px}.stops{padding-top:23px}.stop-list{grid-template-columns:repeat(2,1fr)}.stop{min-height:80px}.footer{margin-top:23px}}@media(prefers-reduced-motion:reduce){.city-button .dot,.stop{transition:none}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top"><div class="brand"><span class="brandmark" aria-hidden="true">✧</span><span>Yuki's Travel Atlas</span></div><small>我的旅行足迹 · 2026</small></header>
    <section class="intro" aria-labelledby="page-title"><div><span class="eyebrow">SPAIN · JUN 2026</span><h1 id="page-title">一段西班牙的夏天</h1><p>从马德里出发，点开地图，重走每一站。</p></div><div class="count"><b>06</b><span>座城市 · 一段旅程</span></div></section>
    <div class="workspace">
      <section class="map-panel" aria-label="西班牙旅行地图"><div class="map-head"><div><strong>旅行路线</strong><span>6 月 5 日 — 19 日</span></div><div class="map-key"><i aria-hidden="true"></i> 点击地点查看</div></div><div class="map-wrap" id="map-wrap">
        <svg viewBox="0 0 760 490" preserveAspectRatio="xMidYMid meet" role="img" aria-label="西班牙与巴利阿里群岛的示意地图，标出六座旅途城市">
          <defs><pattern id="grain" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="2" cy="3" r=".5" fill="#93afb5" opacity=".3"/></pattern></defs>
          <path class="gridline" d="M0 122H760M0 256H760M0 390H760M145 0V490M355 0V490M565 0V490"/>
          <path class="coast-hint" d="M77 113 C110 102 153 116 198 102 C240 91 288 103 326 94 C369 81 404 88 447 96 C484 103 523 95 551 110 L553 156 C534 170 518 181 501 208 C487 231 465 260 442 271 C423 283 418 305 401 325 C378 357 355 375 324 383 C298 392 276 414 257 423 C239 434 212 427 199 410 C177 390 151 399 137 386 C120 371 130 348 115 328 C100 307 82 303 74 284 C68 260 90 243 75 220 C60 198 72 180 63 157 Z"/>
          <path class="island" d="M624 251 C641 241 672 242 687 252 C697 258 694 271 678 274 C658 278 631 272 622 263 Z"/>
          <path d="M0 0H760V490H0Z" fill="url(#grain)" opacity=".45"/>
          <text class="map-label" x="66" y="91">ATLANTIC</text><text class="map-label" x="506" y="389">MEDITERRANEAN SEA</text><text class="map-label" x="239" y="235" style="font-size:26px;letter-spacing:.18em;opacity:.43">ESPAÑA</text>
          <path class="route" id="route-line" d=""/>
        </svg>
      </div><div class="map-foot">位置为路线示意 · 点击城市切换</div></section>
      <aside class="detail" aria-live="polite"><div class="detail-image"><img src="./spain-journal.png" alt="西班牙夏日旅行意境图"><span class="image-credit">旅行意境图</span></div><div class="detail-body"><span class="detail-index" id="detail-index"></span><h2 id="detail-name"></h2><p class="english" id="detail-en"></p><h3>记下的地点与片段</h3><ul class="places" id="detail-places"></ul><p class="detail-note">旅程记录 · 西班牙，2026 年 6 月</p></div></aside>
    </div>
    <section class="stops" aria-label="旅行城市列表"><div class="section-line"><h2>沿途六站</h2><span>选择一座城市</span></div><div class="stop-list" id="stop-list"></div></section>
    <footer class="footer">这是一份正在生长的个人旅行地图。下一版，可以把自己的照片和短故事放进每座城市。</footer>
  </main>
  <script>
    const cities = [
      {id:'madrid',name:'马德里',en:'Madrid',x:340,y:239,places:['Malacatín 炖菜'],lx:0,ly:-48},
      {id:'sevilla',name:'塞维利亚',en:'Sevilla',x:213,y:348,places:['这一站的照片和故事待补充'],lx:-15,ly:-48},
      {id:'malaga',name:'马拉加',en:'Málaga',x:271,y:395,places:['这一站的照片和故事待补充'],lx:-23,ly:0},
      {id:'granada',name:'格拉纳达',en:'Granada',x:327,y:368,places:['阿宫酒店'],lx:42,ly:0},
      {id:'barcelona',name:'巴塞罗那',en:'Barcelona',x:526,y:156,places:['圣家堂','加泰罗尼亚音乐宫','米拉之家 · 巴特罗之家'],lx:12,ly:-48},
      {id:'mallorca',name:'马略卡',en:'Mallorca',x:657,y:258,places:['Belmond La Residencia','Formentor 自驾'],lx:0,ly:0}
    ];
    const map = document.getElementById('map-wrap');
    const list = document.getElementById('stop-list');
    const svg = map.querySelector('svg');
    const path = document.getElementById('route-line');
    path.setAttribute('d','M '+cities.map(c=>`${c.x} ${c.y}`).join(' L '));
    cities.forEach((city,index)=>{
      const point=document.createElement('button');point.type='button';point.className='city-button';point.dataset.id=city.id;point.setAttribute('aria-label',`查看${city.name}`);point.style.setProperty('--lx',`${city.lx}px`);point.style.setProperty('--ly',`${city.ly}px`);point.innerHTML=`<span class="dot" aria-hidden="true"></span><span class="label">${city.name}</span>`;point.addEventListener('click',()=>{selectCity(city.id);if(window.matchMedia('(max-width: 930px)').matches){document.querySelector('.detail').scrollIntoView({behavior:'smooth',block:'nearest'})}});map.appendChild(point);
      const stop=document.createElement('button');stop.type='button';stop.className='stop';stop.dataset.id=city.id;stop.innerHTML=`<span class="num">${String(index+1).padStart(2,'0')} / 06</span><span class="name">${city.name}</span><span class="en">${city.en}</span>`;stop.addEventListener('click',()=>{selectCity(city.id);if(window.matchMedia('(max-width: 930px)').matches){document.querySelector('.detail').scrollIntoView({behavior:'smooth',block:'nearest'})}});list.appendChild(stop);
    });
    function placePoints(){const box=svg.getBoundingClientRect();const mapBox=map.getBoundingClientRect();const ratio=Math.min(box.width/760,box.height/490);const offsetX=(box.width-760*ratio)/2+box.left-mapBox.left;const offsetY=(box.height-490*ratio)/2+box.top-mapBox.top;cities.forEach(c=>{const b=map.querySelector(`.city-button[data-id="${c.id}"]`);b.style.left=`${offsetX+c.x*ratio}px`;b.style.top=`${offsetY+c.y*ratio}px`})}
    function selectCity(id){const city=cities.find(c=>c.id===id);if(!city)return;document.getElementById('detail-index').textContent=`第 ${String(cities.indexOf(city)+1).padStart(2,'0')} 站 / 06`;document.getElementById('detail-name').textContent=city.name;document.getElementById('detail-en').textContent=city.en;document.getElementById('detail-places').replaceChildren(...city.places.map(p=>{const li=document.createElement('li');li.textContent=p;return li}));document.querySelectorAll('[data-id]').forEach(el=>{const active=el.dataset.id===id;el.classList.toggle('active',active);el.setAttribute('aria-pressed',String(active))})}
    new ResizeObserver(placePoints).observe(svg);selectCity('madrid');placePoints();
    if(document.modelContext?.registerTool){
      try { Promise.resolve(document.modelContext.registerTool({
        name:'select_travel_city',title:'选择旅行城市',
        description:'在旅行地图上选择一座城市，显示这一站已记录的地点。',
        inputSchema:{type:'object',properties:{cityId:{type:'string',enum:cities.map(c=>c.id)}},required:['cityId'],additionalProperties:false},
        annotations:{readOnlyHint:false},
        execute(input){if(!input||typeof input.cityId!=='string'||!cities.some(c=>c.id===input.cityId))throw new Error('未知城市');selectCity(input.cityId);const c=cities.find(c=>c.id===input.cityId);return {selectedCity:c.name,places:c.places}}
      })).catch(()=>{}); } catch (_) {}
    }
  </script>
</body>
</html>
